<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>139-04-04</title>
<style>
/* ── 페이지 설정 (A4) ── */
@page { size: A4 portrait; margin: 14mm 15mm 14mm 15mm; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Malgun Gothic', '맑은 고딕', Arial, sans-serif;
  font-size: 10pt;
  color: #111;
  background: #fff;
  width: 180mm;
}

/* ── 제목 ── */
.tbox {
  background: #1a365d;
  color: #fff;
  text-align: center;
  padding: 9px 12px;
  font-size: 13pt;
  font-weight: bold;
  margin-bottom: 12px;
  border: 2px solid #1a365d;
}
.tline { line-height: 1.55; }

/* ── 모식도 트리 ── */
.diagram { display: flex; flex-direction: column; gap: 5px; }

/* 구분 박스 */
.branch { display: flex; align-items: stretch; }
.blabel {
  width: 64px; min-width: 64px;
  border: 2px solid #2b6cb0;
  background: #bee3f8;
  text-align: center;
  font-weight: bold;
  font-size: 10pt;
  display: flex; align-items: center; justify-content: center;
  padding: 5px 3px;
  word-break: keep-all;
  line-height: 1.45;
}

/* 연결선 */
.bitems {
  flex: 1;
  display: flex; flex-direction: column; gap: 3px;
  padding-left: 7px;
  border-left: 2.5px solid #2b6cb0;
  margin-left: 6px;
}

/* 세부항목 행 */
.item { display: flex; align-items: stretch; border: 1.5px solid #90cdf4; }
.ilabel {
  width: 92px; min-width: 92px;
  border-right: 1.5px solid #90cdf4;
  background: #ebf8ff;
  text-align: center;
  font-size: 9.5pt;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  padding: 5px 3px;
  word-break: keep-all;
  line-height: 1.45;
}

/* 주요내용 */
.icontent {
  flex: 1;
  padding: 5px 9px;
  font-size: 10pt;
  line-height: 1.7;
  word-break: keep-all;
  color: #1a202c;
}

/* 인쇄 시 색상 강제 출력 */
@media print {
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div class="tbox"><div class="tline">[139-04-04] 139-04-04</div></div>
<div class="diagram">
    <div class="branch">
        <div class="blabel">개요</div>
        <div class="bitems">
            <div class="item">
                <div class="ilabel">위험성</div>
                <div class="icontent">불안정, 석면 노출, 낙하 위험...<br>2021년 법 강화</div>
            </div>
        </div>
    </div>
    <div class="branch">
        <div class="blabel">확인사항</div>
        <div class="bitems">
            <div class="item">
                <div class="ilabel">착공전</div>
                <div class="icontent"></div>
            </div>
            <div class="item">
                <div class="ilabel">시공단계</div>
                <div class="icontent"></div>
            </div>
            <div class="item">
                <div class="ilabel">준공</div>
                <div class="icontent">현장 정리<br>토양오염 확인<br>보고서 제출<br>폐기물 처리</div>
            </div>
        </div>
    </div>
    <div class="branch">
        <div class="blabel">대책</div>
        <div class="bitems">
            <div class="item">
                <div class="ilabel">안전대책</div>
                <div class="icontent"></div>
            </div>
            <div class="item">
                <div class="ilabel">법적사항</div>
                <div class="icontent">감리자 지정<br>계획서 제출<br>비용 계상<br>석면 조사</div>
            </div>
            <div class="item">
                <div class="ilabel">비상대응</div>
                <div class="icontent">붕괴 발생 시 대처<br>석면 비산 시 중단<br>연락망 게시</div>
            </div>
        </div>
    </div>
    <div class="branch">
        <div class="blabel">결론</div>
        <div class="bitems">
            <div class="item">
                <div class="ilabel">단계별 확인</div>
                <div class="icontent"></div>
            </div>
            <div class="item">
                <div class="ilabel">안전대책</div>
                <div class="icontent">재해 예방</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
