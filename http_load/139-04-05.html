<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>139-04-05</title>
<style>
/* ── 페이지 설정 (A4) ── */
@page { size: A4 portrait; margin: 14mm 15mm 14mm 15mm; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Malgun Gothic', '맑은 고딕', Arial, sans-serif;
  font-size: 10pt;
  color: #111;
  background: #fff;
  width: 180mm;
}

/* ── 제목 ── */
.tbox {
  background: #1a365d;
  color: #fff;
  text-align: center;
  padding: 9px 12px;
  font-size: 13pt;
  font-weight: bold;
  margin-bottom: 12px;
  border: 2px solid #1a365d;
}
.tline { line-height: 1.55; }

/* ── 모식도 트리 ── */
.diagram { display: flex; flex-direction: column; gap: 5px; }

/* 구분 박스 */
.branch { display: flex; align-items: stretch; }
.blabel {
  width: 64px; min-width: 64px;
  border: 2px solid #2b6cb0;
  background: #bee3f8;
  text-align: center;
  font-weight: bold;
  font-size: 10pt;
  display: flex; align-items: center; justify-content: center;
  padding: 5px 3px;
  word-break: keep-all;
  line-height: 1.45;
}

/* 연결선 */
.bitems {
  flex: 1;
  display: flex; flex-direction: column; gap: 3px;
  padding-left: 7px;
  border-left: 2.5px solid #2b6cb0;
  margin-left: 6px;
}

/* 세부항목 행 */
.item { display: flex; align-items: stretch; border: 1.5px solid #90cdf4; }
.ilabel {
  width: 92px; min-width: 92px;
  border-right: 1.5px solid #90cdf4;
  background: #ebf8ff;
  text-align: center;
  font-size: 9.5pt;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  padding: 5px 3px;
  word-break: keep-all;
  line-height: 1.45;
}

/* 주요내용 */
.icontent {
  flex: 1;
  padding: 5px 9px;
  font-size: 10pt;
  line-height: 1.7;
  word-break: keep-all;
  color: #1a202c;
}

/* 인쇄 시 색상 강제 출력 */
@media print {
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div class="tbox"><div class="tline">[139-04-05] 139-04-05</div></div>
<div class="diagram">
    <div class="branch">
        <div class="blabel">개요</div>
        <div class="bitems">
            <div class="item">
                <div class="ilabel">정의</div>
                <div class="icontent">지반 자체 지지능력 활용, 숏크리트·록볼트로 터널 굴착<br>막장면 위험 부위</div>
            </div>
        </div>
    </div>
    <div class="branch">
        <div class="blabel">원인</div>
        <div class="bitems">
            <div class="item">
                <div class="ilabel">지질학적</div>
                <div class="icontent"></div>
            </div>
            <div class="item">
                <div class="ilabel">수문학적</div>
                <div class="icontent"></div>
            </div>
            <div class="item">
                <div class="ilabel">시공 및 관리</div>
                <div class="icontent"></div>
            </div>
        </div>
    </div>
    <div class="branch">
        <div class="blabel">대책</div>
        <div class="bitems">
            <div class="item">
                <div class="ilabel">조사 설계</div>
                <div class="icontent">지반조사, TSP 실시, 지반 등급 재분류<br>막장 자립 검토</div>
            </div>
            <div class="item">
                <div class="ilabel">시공 단계</div>
                <div class="icontent"></div>
            </div>
            <div class="item">
                <div class="ilabel">계측 관리</div>
                <div class="icontent">내공 변위, 천단 침하, 지표 침하 계측<br>이상 징후 발생 시 대응</div>
            </div>
            <div class="item">
                <div class="ilabel">안전 관리</div>
                <div class="icontent">접근 통제, 2인 1조 원칙, 비상 대피로 확보<br>긴급대응 훈련</div>
            </div>
        </div>
    </div>
    <div class="branch">
        <div class="blabel">결론</div>
        <div class="bitems">
            <div class="item">
                <div class="ilabel">원인 복합적</div>
                <div class="icontent">지질학적, 수문학적, 시공 관리 원인이 복합 작용<br>사전조사·계측 체계 이행 필요</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
